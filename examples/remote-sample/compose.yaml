services:
  remote-sample:
    build: .
    image: aegis/remote-sample:0.1.0
    user: "${AEGIS_RUNTIME_UID:-1000}:${AEGIS_RUNTIME_GID:-1000}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      AEGIS_PLUGIN_SERVICE_TOKEN: ${AEGIS_PLUGIN_SERVICE_TOKEN:?Set scoped token}
    volumes:
      - ${AEGIS_REMOTE_TLS_DIR:?Set TLS directory}:/run/tls:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - "/tmp:size=16m,noexec,nosuid,nodev"
    networks: [plugin]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,ssl,urllib.request; c=ssl.create_default_context(cafile='/run/tls/server.crt'); urllib.request.urlopen('https://remote-sample:8443/health/ready',context=c,timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  plugin:
    internal: true
